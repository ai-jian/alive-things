<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Alive Things</title>
    <style>
      html, body { margin: 0; height: 100%; background: #efe9df; color: #2e2a36; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #intro { position: fixed; left: 16px; bottom: 16px; max-width: 360px; padding: 12px 14px; background: rgba(255,253,248,.9); border-radius: 10px; font-size: 14px; line-height: 1.45; pointer-events: none; }
      #intro b { display: block; font-size: 18px; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="intro">
      <b>Alive Things</b>
      Pick up a cup. Be quiet for ten minutes. It comes alive.<br />
      On a Quest: tap the headset button to enter. Hands only.
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
